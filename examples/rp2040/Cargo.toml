[package]
name = "w5500-examples-rp2040"
version = "0.0.0"
edition = "2021"
publish = false

# Standalone workspace: keeps embassy/cortex-m deps out of the library's tree.
[workspace]

[dependencies]
w5500-hl = { path = "../../hl", features = ["eha1"] }
w5500-ll = { path = "../../ll", features = ["eh1", "eha1"] }

embassy-executor = { version = "0.7", features = ["arch-cortex-m", "executor-thread"] }
embassy-rp = { version = "0.4", features = ["time-driver", "critical-section-impl", "rp2040"] }
embassy-time = "0.4"
embassy-sync = "0.6"
embassy-embedded-hal = "0.3"

# Logging goes out the RP2040's own USB port as CDC-ACM plain text, so these
# tests need no debug probe -- any serial terminal reads them. Pinned to the
# 0.4 line on purpose: embassy-usb 0.6 requires embassy-usb-driver 0.2, and
# embassy-rp 0.4 provides 0.1.
embassy-usb-logger = "0.4"
log = "0.4"

cortex-m = "0.7"
cortex-m-rt = "0.7"
# Without a probe a panic is an invisible hang, so the binaries route every
# recoverable driver failure through `log` instead. This is the backstop for
# the unreachable cases; the symptom is the USB serial port disappearing.
panic-halt = "1"
static_cell = "2"
# thumbv6m (Cortex-M0+) lacks native CAS; static_cell's internal
# portable-atomic needs the critical-section backend instead.
portable-atomic = { version = "1", features = ["critical-section"] }

[profile.release]
debug = 2
lto = true
opt-level = "z"
